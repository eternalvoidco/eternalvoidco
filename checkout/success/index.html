<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Acquisition Confirmed | VOID©</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg?v=20260713-ev">
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico?v=20260713-ev">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/void-checkout.css?v=20260907a">
    <script>
        // Animation is an enhancement, so it is opted into rather than out of.
        // If this never runs — script error, blocked script, a stale stylesheet —
        // every element is already in its final, visible state. Inline and in the
        // head so the entrance state applies before first paint, with no flash.
        try {
            if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.documentElement.dataset.motion = 'on';
            }
        } catch (e) { /* leave the page in its visible default */ }
    </script>
</head>
<body>
    <div class="ck-atmos" aria-hidden="true"></div>

    <header class="ck-head">
        <a class="ck-back" href="/shop"><i aria-hidden="true"></i>Collection</a>
        <a class="ck-mark" href="/">VOID<sup>©</sup></a>
        <span class="ck-secure"></span>
    </header>

    <main class="ck-confirm" id="ckConfirm" data-result="pending" aria-live="polite">
        <span class="ck-seal" aria-hidden="true"></span>

        <!-- One mark, two glyphs. Which one is drawn — and how — is the whole
             difference between the two outcomes. -->
        <svg class="ck-result-mark" viewBox="0 0 48 48" aria-hidden="true">
            <circle class="ck-mark-ring" cx="24" cy="24" r="21"/>
            <path class="ck-mark-glyph" id="ckGlyph" d="M15 24.5 L21.5 31 L33.5 18"/>
        </svg>

        <!-- A customer only reaches this page after Stripe accepted the
             payment, so the shell says so from the first paint. The order
             number and the exact status are hydrated over the top; nothing here
             waits on a network call to become legible. -->
        <p class="ck-confirm-eyebrow" id="ckEyebrow">Payment Received</p>
        <h1 class="ck-confirm-number" id="ckNumber">Thank you</h1>
        <p class="ck-confirm-copy" id="ckCopy">We are retrieving your order details. A confirmation is on its way to your email.</p>

        <section class="ck-confirm-panel" id="ckPanel" hidden>
            <h2 class="ck-summary-title" style="display:block;margin-bottom:1.2rem;">Your Selection</h2>
            <ul class="ck-lines" id="ckItems"></ul>

            <div class="ck-totals">
                <p class="ck-total-row"><span>Subtotal</span><b id="ckSubtotal">—</b></p>
                <p class="ck-total-row"><span>Delivery</span><b id="ckShipping">—</b></p>
                <p class="ck-total-row is-grand"><span>Total</span><b id="ckTotal">—</b></p>
            </div>

            <h2 class="ck-summary-title" style="display:block;margin:2.4rem 0 1rem;">Delivery</h2>
            <p class="ck-summary-note" id="ckAddress" style="font-size:0.76rem;line-height:2;"></p>
            <p class="ck-summary-note" id="ckEmailNote"></p>
        </section>

        <div class="ck-confirm-actions" id="ckActions">
            <a class="ck-cta is-final" href="/shop" style="display:grid;place-items:center;text-decoration:none;">Continue to Boutique</a>
        </div>
    </main>

    <script type="module">
        // The success page reports what the database records, and nothing more.
        // Arriving here is not what makes an order paid — only the verified
        // Stripe webhook does that — so a payment still settling is described
        // honestly rather than declared complete.
        const params = new URLSearchParams(location.search);
        const number = params.get('order') || '';
        const email = params.get('email') || '';

        const $ = (id) => document.getElementById(id);
        const fmt = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'EUR' });
        const money = (minor) => (minor == null ? '—' : fmt.format(minor / 100));

        const CHECK = 'M15 24.5 L21.5 31 L33.5 18';
        const CROSS = 'M17 17 L31 31 M31 17 L17 31';

        // Sets the outcome before any of the copy, so the mark and the motion
        // that belong to it start together rather than one catching up.
        function setResult(result) {
            $('ckConfirm').dataset.result = result;
            $('ckGlyph').setAttribute('d', result === 'failed' ? CROSS : CHECK);
        }

        function say(eyebrow, title, copy) {
            $('ckEyebrow').textContent = eyebrow;
            $('ckNumber').textContent = title;
            $('ckCopy').textContent = copy;
        }

        // A failed payment keeps the bag, so the retry is a return to the same
        // checkout rather than a restart.
        function setActions(result) {
            const actions = $('ckActions');
            actions.textContent = '';

            const link = (href, label, quiet) => {
                const a = document.createElement('a');
                a.className = 'ck-cta' + (quiet ? ' is-quiet' : ' is-final');
                a.href = href;
                a.textContent = label;
                a.style.cssText = 'display:grid;place-items:center;text-decoration:none;';
                return a;
            };

            if (result === 'failed') {
                actions.append(link('/checkout', 'Try Again'), link('/shop', 'Return to Collection', true));
            } else {
                actions.append(link('/shop', 'Continue to Boutique'));
            }
        }

        function renderOrder(order) {
            const paid = order.paymentStatus === 'paid';

            if (paid) {
                setResult('success');
                setActions('success');
                say('Payment Successful', order.orderNumber,
                    `${order.firstName}, your selection has entered preparation. A confirmation is on its way to ${order.email}.`);
            } else if (order.paymentStatus === 'failed') {
                setResult('failed');
                setActions('failed');
                say('Payment Unsuccessful', order.orderNumber,
                    'This payment did not complete. Your selection is unchanged and nothing has been charged — you can try again from the checkout.');
            } else {
                setResult('pending');
                setActions('pending');
                say('Awaiting Confirmation', order.orderNumber,
                    'Your payment is still settling with the bank. This page will show the confirmation once it clears; you will also receive an email.');
            }

            // The headline above is the part that matters and is already set.
            // Everything below is detail, so it is wrapped: a missing or
            // malformed field costs a line of the summary, never the whole
            // confirmation.
            try {
                renderDetail(order);
            } catch (error) {
                console.warn('checkout/success: detail render skipped', error && error.message);
            }
        }

        function renderDetail(order) {
            const paid = order.paymentStatus === 'paid';
            const list = $('ckItems');
            list.textContent = '';
            (order.items || []).forEach((item) => {
                const li = document.createElement('li');
                li.className = 'ck-line';

                const media = document.createElement('div');
                media.className = 'ck-line-media';
                if (item.image) {
                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = '';
                    img.loading = 'lazy';
                    media.appendChild(img);
                }

                const info = document.createElement('div');
                const name = document.createElement('span');
                name.className = 'ck-line-name';
                name.textContent = item.name;
                const meta = document.createElement('span');
                meta.className = 'ck-line-meta';
                meta.textContent = `Size ${item.size} · ${item.quantity}`;
                info.append(name, meta);

                const price = document.createElement('span');
                price.className = 'ck-line-price';
                price.textContent = money(item.unitAmount * item.quantity);

                li.append(media, info, price);
                list.appendChild(li);
            });

            $('ckSubtotal').textContent = money(order.subtotalAmount);
            $('ckShipping').textContent = money(order.shippingAmount);
            $('ckTotal').textContent = money(order.totalAmount);

            const a = order.shippingAddress || {};
            $('ckAddress').innerHTML = [
                `${a.firstName || ''} ${a.lastName || ''}`.trim(),
                a.line1, a.line2, `${a.postalCode || ''} ${a.city || ''}`.trim(), a.country
            ].filter(Boolean).map((line) => line.replace(/[<>&]/g, '')).join('<br>');

            $('ckEmailNote').textContent = paid
                ? `Quote ${order.orderNumber} in any correspondence about this order.`
                : '';

            $('ckPanel').hidden = false;
        }

        // Stripe returns the browser here the moment it accepts the payment, but
        // the order is only marked paid by the webhook — a separate request
        // arriving on its own schedule. Landing first is normal, not a failure,
        // so a pending record is re-read a few times before it is believed.
        // Bounded: five attempts over ~2.8s, then a definite state.
        const POLL_ATTEMPTS = 5;
        const POLL_DELAY = 700;
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));

        async function fetchOrder() {
            const abort = new AbortController();
            const timer = setTimeout(() => abort.abort(), 8000);
            try {
                const res = await fetch(
                    `/api/checkout/order?number=${encodeURIComponent(number)}&email=${encodeURIComponent(email)}`,
                    { cache: 'no-store', signal: abort.signal }
                );
                if (!res.ok) throw new Error(String(res.status));
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        async function load() {
            if (!number || !email) {
                setResult('failed');
                setActions('failed');
                say('Order Not Found', 'Incomplete link', 'This confirmation link is missing part of its reference. Check the link in your email, or contact an advisor.');
                return;
            }

            for (let attempt = 0; attempt < POLL_ATTEMPTS; attempt += 1) {
                let order;
                try {
                    order = await fetchOrder();
                } catch (error) {
                    // The payment itself is not in doubt — Stripe would not have
                    // returned here otherwise — only our reading of the record.
                    // Say that, rather than casting doubt on a payment that went
                    // through, and give the number so support can trace it.
                    console.warn('checkout/success: order lookup unavailable', error && error.name);
                    setResult('pending');
                    setActions('pending');
                    say('Payment Received', number,
                        'Your payment went through. We could not load the order details just now — your confirmation email has them, and support@eternalvoid.co can help if you quote this number.');
                    return;
                }

                // Settled, either way. Render it and stop asking.
                if (!order || order.paymentStatus !== 'pending') {
                    renderOrder(order || {});
                    return;
                }

                // Still pending. Show a deliberate verifying state — never an
                // empty one — and re-read shortly.
                setResult('pending');
                setActions('pending');
                say('Verifying Acquisition', order.orderNumber || number,
                    'Your payment was accepted and is being verified with the bank. This will only take a moment.');

                if (attempt < POLL_ATTEMPTS - 1) await wait(POLL_DELAY);
            }

            // Exhausted. The payment is real; only the confirmation is late.
            setResult('pending');
            setActions('pending');
            say('Confirmation Pending', number,
                'Your payment was received and is being verified. You will receive confirmation by email as soon as it completes — no further action is needed.');
        }

        load();
    </script>
</body>
</html>

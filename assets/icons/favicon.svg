<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="VOID">
  <defs>
    <linearGradient id="voidGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7d4a6"/>
      <stop offset="0.5" stop-color="#c7a96c"/>
      <stop offset="1" stop-color="#9c7c46"/>
    </linearGradient>
    <!-- moat: cuts a hairline gap in the V wherever the I crosses in front -->
    <mask id="cutV" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <path d="M38 20 L62 20 L62 25 L54.5 25 L54.5 79 L62 79 L62 84 L38 84 L38 79 L45.5 79 L45.5 25 L38 25 Z"
            fill="none" stroke="#000" stroke-width="2.6" stroke-linejoin="miter"/>
    </mask>
    <g id="voidMark" fill="url(#voidGold)">
      <!-- serif V, behind, with the moat cut out -->
      <g mask="url(#cutV)">
        <rect x="10" y="18" width="15" height="4.6" rx="1.2"/>
        <rect x="75" y="18" width="15" height="4.6" rx="1.2"/>
        <path d="M12 22 L23 22 L50 74 L77 22 L88 22 L50 90 Z"/>
      </g>
      <!-- serif I, in front -->
      <path d="M38 20 L62 20 L62 25 L54.5 25 L54.5 79 L62 79 L62 84 L38 84 L38 79 L45.5 79 L45.5 25 L38 25 Z"/>
    </g>
  </defs>
  <use href="#voidMark"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="VOID">
  <!-- VOID crest: serif V inside a ring, jewel at the crown. Black, transparent bg. -->
  <g fill="#080808">
    <!-- crown jewel -->
    <path d="M16 0.7 L18.3 3.0 L16 5.3 L13.7 3.0 Z"/>
    <!-- V top serifs -->
    <rect x="7.9" y="9.9" width="4.5" height="1.3" rx="0.35"/>
    <rect x="19.6" y="9.9" width="4.5" height="1.3" rx="0.35"/>
    <!-- the serif V -->
    <path d="M9.0 10.8 L11.3 10.8 L16 18.6 L20.7 10.8 L23.0 10.8 L16 21.8 Z"/>
  </g>
  <!-- ring -->
  <circle cx="16" cy="16" r="12.6" fill="none" stroke="#080808" stroke-width="1.7"/>
</svg>

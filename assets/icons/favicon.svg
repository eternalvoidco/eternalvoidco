<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="VOID">
  <defs>
    <linearGradient id="voidGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7d4a6"/>
      <stop offset="0.5" stop-color="#c7a96c"/>
      <stop offset="1" stop-color="#9c7c46"/>
    </linearGradient>
    <!-- moat: cuts a hairline gap in the I along the V's edge, so the I looks like it emerges from the V -->
    <mask id="cutI" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <path d="M12 18 L23 18 L50 66 L77 18 L88 18 L50 78 Z"
            fill="none" stroke="#000" stroke-width="2.8" stroke-linejoin="miter"/>
    </mask>
    <g id="voidMark" fill="url(#voidGold)">
      <!-- serif I, behind, emerging from the base of the V -->
      <path d="M38 16 L62 16 L62 21 L54.5 21 L54.5 85 L62 85 L62 90 L38 90 L38 85 L45.5 85 L45.5 21 L38 21 Z"
            mask="url(#cutI)"/>
      <!-- serif V, in front -->
      <rect x="10" y="14" width="15" height="4.6" rx="1.2"/>
      <rect x="75" y="14" width="15" height="4.6" rx="1.2"/>
      <path d="M12 18 L23 18 L50 66 L77 18 L88 18 L50 78 Z"/>
    </g>
  </defs>
  <use href="#voidMark"/>
</svg>

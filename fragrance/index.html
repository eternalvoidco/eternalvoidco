            <!-- Product stage. Every layer is separate so each can respond to
                 the pointer with its own weight — see PARALLAX in the script. -->

    <script>
        (function initNeantStage() {
            const stage = document.getElementById('frStage');
            if (!stage) return;

            const root = document.documentElement;
            const reduced = () => root.classList.contains('reduce-motion');
            const readVar = (name, fallback) => {
                const v = parseFloat(getComputedStyle(root).getPropertyValue(name));
                return Number.isFinite(v) ? v : fallback;
            };

            // Inertia constants come from the same :root block as the visuals,
            // so tuning happens in one place.
            const DAMPING = readVar('--fr-damping', 0.055);
            const RELEASE_DAMPING = readVar('--fr-release-damping', 0.035);

            // target = where the pointer says we should be; current = where the
            // glass actually is. The gap between them is the weight.
            let targetX = 0, targetY = 0, targetActive = 0;
            let curX = 0, curY = 0, curActive = 0;
            let rafId = null, running = false, onScreen = true;

            const EPS = 0.0005;

            function frame() {
                if (!running) return;
                const d = targetActive > 0 ? DAMPING : RELEASE_DAMPING;
                curX += (targetX - curX) * d;
                curY += (targetY - curY) * d;
                curActive += (targetActive - curActive) * 0.06;

                root.style.setProperty('--fr-px', curX.toFixed(4));
                root.style.setProperty('--fr-py', curY.toFixed(4));
                root.style.setProperty('--fr-active', curActive.toFixed(4));

                // Settle and stop rather than spinning a loop forever.
                const settled = Math.abs(targetX - curX) < EPS
                    && Math.abs(targetY - curY) < EPS
                    && Math.abs(targetActive - curActive) < EPS;
                if (settled) { running = false; rafId = null; return; }
                rafId = window.requestAnimationFrame(frame);
            }

            function kick() {
                if (running || reduced() || !onScreen || document.hidden) return;
                running = true;
                rafId = window.requestAnimationFrame(frame);
            }

            // Pointer handling writes only to plain numbers; the rAF loop is the
            // single writer of CSS variables, so rapid movement can never queue
            // up style writes or thrash layout.
            function onMove(e) {
                if (reduced()) return;
                const r = stage.getBoundingClientRect();
                if (!r.width || !r.height) return;
                targetX = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2));
                targetY = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - 0.5) * 2));
                targetActive = 1;
                kick();
            }

            function onLeave() {
                targetX = 0; targetY = 0; targetActive = 0;
                kick();
            }

            // Fine pointers only — a touch device gets the ambient drift below
            // instead, with no hover state to get stuck in.
            const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');

            function bindPointer() {
                stage.addEventListener('pointermove', onMove, { passive: true });
                stage.addEventListener('pointerleave', onLeave, { passive: true });
            }
            function unbindPointer() {
                stage.removeEventListener('pointermove', onMove);
                stage.removeEventListener('pointerleave', onLeave);
            }

            // ── Ambient drift (touch / coarse pointers) ──
            // A slow figure-eight so the glass is never entirely static, well
            // under the tilt used for hover.
            let driftId = null, driftT = 0;
            function drift() {
                if (reduced() || !onScreen || document.hidden) { driftId = null; return; }
                driftT += 0.0045;
                curX = Math.sin(driftT) * 0.32;
                curY = Math.sin(driftT * 0.6) * 0.18;
                root.style.setProperty('--fr-px', curX.toFixed(4));
                root.style.setProperty('--fr-py', curY.toFixed(4));
                root.style.setProperty('--fr-active', '0.35');
                driftId = window.requestAnimationFrame(drift);
            }
            function startDrift() { if (!driftId) driftId = window.requestAnimationFrame(drift); }
            function stopDrift() {
                if (driftId) { window.cancelAnimationFrame(driftId); driftId = null; }
            }

            function applyMode() {
                unbindPointer(); stopDrift();
                if (reduced()) {
                    root.style.setProperty('--fr-px', '0');
                    root.style.setProperty('--fr-py', '0');
                    root.style.setProperty('--fr-active', '0');
                    return;
                }
                if (finePointer.matches) bindPointer(); else startDrift();
            }

            applyMode();
            if (finePointer.addEventListener) finePointer.addEventListener('change', applyMode);

            // Never animate off-screen or in a background tab.
            if ('IntersectionObserver' in window) {
                new IntersectionObserver((entries) => {
                    onScreen = entries.some((en) => en.isIntersecting);
                    if (!onScreen) { running = false; stopDrift(); }
                    else if (!finePointer.matches) startDrift();
                }, { threshold: 0.01 }).observe(stage);
            }
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) { running = false; stopDrift(); }
                else if (onScreen && !finePointer.matches && !reduced()) startDrift();
            });

            // ── Entrance ──
            // Content is in the DOM and readable immediately; this only starts
            // the opacity reveal, so nothing is gated behind the animation.
            window.setTimeout(() => document.body.classList.add('is-ready'), 60);

            // ── Editorial reveals ──
            const reveals = Array.from(document.querySelectorAll('.fr-reveal'));
            if ('IntersectionObserver' in window && reveals.length) {
                const io = new IntersectionObserver((entries) => {
                    entries.forEach((en) => {
                        if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); }
                    });
                }, { threshold: 0.18, rootMargin: '0px 0px -8% 0px' });
                reveals.forEach((el) => io.observe(el));
            } else {
                reveals.forEach((el) => el.classList.add('is-in'));
            }
        })();
    </script>
